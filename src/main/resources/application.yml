spring:
  application:
    name: atlas
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/atlas}
    username: ${SPRING_DATASOURCE_USERNAME:atlas}
    password: ${SPRING_DATASOURCE_PASSWORD:atlas}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

atlas:
  setup:
    enabled: ${ATLAS_SETUP_ENABLED:true}
  telegram:
    enabled: ${ATLAS_TELEGRAM_ENABLED:false}
    bot-token: ${ATLAS_TELEGRAM_BOT_TOKEN:}
    bot-username: ${ATLAS_TELEGRAM_BOT_USERNAME:}
    mode: ${ATLAS_TELEGRAM_MODE:polling}
    webhook-path: ${ATLAS_TELEGRAM_WEBHOOK_PATH:/telegram/webhook}
    webhook-url: ${ATLAS_TELEGRAM_WEBHOOK_URL:}
    webhook-secret: ${ATLAS_TELEGRAM_WEBHOOK_SECRET:}
    public-base-url: ${ATLAS_PUBLIC_BASE_URL:}
    register-webhook-on-startup: ${ATLAS_TELEGRAM_REGISTER_WEBHOOK_ON_STARTUP:false}
    drop-pending-updates-on-webhook-registration: ${ATLAS_TELEGRAM_DROP_PENDING_UPDATES_ON_WEBHOOK_REGISTRATION:true}
  llm:
    enabled: ${ATLAS_LLM_ENABLED:false}
    provider: ${ATLAS_LLM_PROVIDER:openai_compatible}
    base-url: ${ATLAS_LLM_BASE_URL:}
    api-key: ${ATLAS_LLM_API_KEY:}
    model: ${ATLAS_LLM_MODEL:}
    timeout-seconds: ${ATLAS_LLM_TIMEOUT_SECONDS:20}
    max-output-tokens: ${ATLAS_LLM_MAX_OUTPUT_TOKENS:700}
    temperature: ${ATLAS_LLM_TEMPERATURE:0.3}
    connect-timeout-seconds: ${ATLAS_LLM_CONNECT_TIMEOUT_SECONDS:5}
    retry-enabled: ${ATLAS_LLM_RETRY_ENABLED:true}
    max-retries: ${ATLAS_LLM_MAX_RETRIES:2}
    day-plan-enabled: ${ATLAS_LLM_DAY_PLAN_ENABLED:true}
    report-enabled: ${ATLAS_LLM_REPORT_ENABLED:true}
    question-enabled: ${ATLAS_LLM_QUESTION_ENABLED:true}
