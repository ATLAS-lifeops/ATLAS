spring:
  application:
    name: atlas
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/atlas}
    username: ${SPRING_DATASOURCE_USERNAME:atlas}
    password: ${SPRING_DATASOURCE_PASSWORD:atlas}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

atlas:
  telegram:
    enabled: ${ATLAS_TELEGRAM_ENABLED:false}
    bot-token: ${ATLAS_TELEGRAM_BOT_TOKEN:}
    bot-username: ${ATLAS_TELEGRAM_BOT_USERNAME:}
