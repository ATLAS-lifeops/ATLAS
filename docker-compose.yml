services:
  atlas-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atlas}
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlas}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - atlas-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  atlas-app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      atlas-postgres:
        condition: service_healthy
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: ${SERVER_PORT:-8080}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://atlas-postgres:5432/atlas}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-atlas}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-atlas}
      ATLAS_SETUP_ENABLED: ${ATLAS_SETUP_ENABLED:-true}
      ATLAS_TELEGRAM_BOT_TOKEN: ${ATLAS_TELEGRAM_BOT_TOKEN:-}
      ATLAS_TELEGRAM_BOT_USERNAME: ${ATLAS_TELEGRAM_BOT_USERNAME:-}
      ATLAS_TELEGRAM_MODE: ${ATLAS_TELEGRAM_MODE:-polling}
      ATLAS_TELEGRAM_WEBHOOK_PATH: ${ATLAS_TELEGRAM_WEBHOOK_PATH:-/telegram/webhook}
      ATLAS_TELEGRAM_WEBHOOK_URL: ${ATLAS_TELEGRAM_WEBHOOK_URL:-}
      ATLAS_TELEGRAM_WEBHOOK_SECRET: ${ATLAS_TELEGRAM_WEBHOOK_SECRET:-}
      ATLAS_PUBLIC_BASE_URL: ${ATLAS_PUBLIC_BASE_URL:-}
      ATLAS_TELEGRAM_REGISTER_WEBHOOK_ON_STARTUP: ${ATLAS_TELEGRAM_REGISTER_WEBHOOK_ON_STARTUP:-false}
      ATLAS_TELEGRAM_DROP_PENDING_UPDATES_ON_WEBHOOK_REGISTRATION: ${ATLAS_TELEGRAM_DROP_PENDING_UPDATES_ON_WEBHOOK_REGISTRATION:-true}
      ATLAS_LLM_ENABLED: ${ATLAS_LLM_ENABLED:-false}
      ATLAS_LLM_PROVIDER: ${ATLAS_LLM_PROVIDER:-openai_compatible}
      ATLAS_LLM_BASE_URL: ${ATLAS_LLM_BASE_URL:-}
      ATLAS_LLM_API_KEY: ${ATLAS_LLM_API_KEY:-}
      ATLAS_LLM_MODEL: ${ATLAS_LLM_MODEL:-}
      ATLAS_LLM_TIMEOUT_SECONDS: ${ATLAS_LLM_TIMEOUT_SECONDS:-20}
      ATLAS_LLM_MAX_OUTPUT_TOKENS: ${ATLAS_LLM_MAX_OUTPUT_TOKENS:-700}
      ATLAS_LLM_TEMPERATURE: ${ATLAS_LLM_TEMPERATURE:-0.3}
      ATLAS_LLM_CONNECT_TIMEOUT_SECONDS: ${ATLAS_LLM_CONNECT_TIMEOUT_SECONDS:-5}
      ATLAS_LLM_RETRY_ENABLED: ${ATLAS_LLM_RETRY_ENABLED:-true}
      ATLAS_LLM_MAX_RETRIES: ${ATLAS_LLM_MAX_RETRIES:-2}
      ATLAS_LLM_DAY_PLAN_ENABLED: ${ATLAS_LLM_DAY_PLAN_ENABLED:-true}
      ATLAS_LLM_REPORT_ENABLED: ${ATLAS_LLM_REPORT_ENABLED:-true}
      ATLAS_LLM_QUESTION_ENABLED: ${ATLAS_LLM_QUESTION_ENABLED:-true}
    volumes:
      - atlas-runtime-data:/app/data
    ports:
      - "${SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  atlas-postgres-data:
  atlas-runtime-data:
